<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Patient</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

<header>
    <h1>🏥 Patient Management System</h1>
    <p>Register a New Patient</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="patients.html">List Patients</a>
    <a href="patient-details.html">Find Patient</a>
    <a href="add-patients.html">Add Patient</a>
    <a href="edit-patients.html">Update Patient</a>
</nav>

<main class="form-container">

    <img
        class="page-image"
        src="https://images.unsplash.com/photo-1584515933487-779824d29309?auto=format&fit=crop&w=800&q=80"
        alt="Healthcare worker">

    <h2>Patient Registration Form</h2>

    <form id="addPatientForm">

        <div class="form-grid">

            <div>
                <label>Patient Name *</label>
                <input type="text" name="patient_name" required>
            </div>

            <div>
                <label>Email</label>
                <input type="email" name="patient_email">
            </div>

            <div>
                <label>Phone Number</label>
                <input type="tel" name="phone_no">
            </div>

            <div>
                <label>Gender</label>
                <select name="gender">
                    <option value="">Select Gender</option>
                    <option>Female</option>
                    <option>Male</option>
                    <option>Other</option>
                </select>
            </div>

            <div>
                <label>Age</label>
                <input type="number" name="age" min="0" max="130">
            </div>

            <div>
                <label>Health Problem</label>
                <input type="text" name="problem">
            </div>

        </div>

        <button type="submit">Register Patient</button>

    </form>

    <p id="formMessage" class="message"></p>

</main>

<footer>Patient Management System</footer>

</body>
</html>
