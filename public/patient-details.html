<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Details</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

<header>
    <h1>🏥 Patient Management System</h1>
    <p>Find Patient Details</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="patients.html">List Patients</a>
    <a href="patient-details.html">Find Patient</a>
    <a href="add-patients.html">Add Patient</a>
    <a href="edit-patients.html">Update Patient</a>
</nav>

<main class="details-container">

    <img
        class="page-image"
        src="https://images.unsplash.com/photo-1551076805-e1869033e561?auto=format&fit=crop&w=800&q=80"
        alt="Doctor reviewing patient details">

    <h2>Find a Patient</h2>

    <form id="findPatientForm">
        <label>Enter Patient ID</label>
        <input type="number" id="patientId" min="1" required>
        <button type="submit">Search Patient</button>
    </form>

    <p id="detailsMessage" class="message"></p>

    <div id="patientDetails"></div>

    <hr>

    <h2>Delete Patient</h2>

    <form id="deletePatientForm">
        <label>Enter Patient ID to Delete</label>
        <input type="number" id="deletePatientId" min="1" required>
        <button type="submit" class="danger">Delete Patient</button>
    </form>

    <p id="deleteMessage" class="message"></p>

</main>

<footer>Patient Management System</footer>

</body>
</html>
